name: Deploy E-SUN POWER AGPE Preview

on:
  push:
    branches: [main]
    paths:
      - 'E-SUN-POWER-AGPE/**'
      - '.github/workflows/deploy-agpe-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-agpe
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare AGPE site
        run: |
          mkdir -p _site
          cp -R E-SUN-POWER-AGPE/. _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
