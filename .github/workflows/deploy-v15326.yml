name: Deploy E-SUN POWER V153.26 bundle

on:
  push:
    paths:
      - 'ONLINE_DEPLOY_V15326'
      - '.github/workflows/deploy-v15326.yml'
      - 'consumption_matrix.js'
      - 'consumption_project_integration.js'
      - 'consumption_matrix_bootstrap.js'
      - 'solar_vfd.js'
      - 'data/solar_vfd.json'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download V153.26 bundle
        env:
          SHARE_ID: f7R5anRL5hl-
          FILE_ID: 01a08d24fb42770ea79239c34a5a0c8f
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os, requests
          base='https://api.firestorage.ai/dev/file'
          sid=os.environ['SHARE_ID']; fid=os.environ['FILE_ID']
          s=requests.Session()
          r=s.post(f'{base}/shares/{sid}/cushion-sessions',headers={'Content-Type':'application/json'},json={},timeout=60); r.raise_for_status()
          cushion=r.json()['cushionId']
          r=s.post(f'{base}/shares/{sid}/files/{fid}/download',headers={'X-Firestorage-Cushion-Id':cushion},timeout=60); r.raise_for_status()
          info=r.json(); d=s.get(info['downloadUrl'],stream=True,timeout=180); d.raise_for_status()
          with open('/tmp/v15326.zip','wb') as out:
              for chunk in d.iter_content(1024*1024):
                  if chunk: out.write(chunk)
          PY

      - name: Install V153.26 into V123
        run: |
          set -euxo pipefail
          rm -rf /tmp/v15326 ./V123
          mkdir -p /tmp/v15326 ./V123
          unzip -q /tmp/v15326.zip -d /tmp/v15326
          ROOT=$(find /tmp/v15326 -mindepth 1 -maxdepth 1 -type d | head -n1)
          cp -a "$ROOT"/. ./V123/
          rm -rf ./V123/__pycache__
          cp ./consumption_matrix.js ./V123/consumption_matrix.js
          cp ./consumption_project_integration.js ./V123/consumption_project_integration.js
          cp ./consumption_matrix_bootstrap.js ./V123/consumption_matrix_bootstrap.js
          cp ./solar_vfd.js ./V123/solar_vfd.js
          cp ./data/solar_vfd.json ./V123/data/solar_vfd.json
          python - <<'PY'
          from pathlib import Path
          p=Path('./V123/server.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("HOST = os.environ.get('HOST', '127.0.0.1')", "HOST = os.environ.get('HOST', '0.0.0.0')")
          old="def _playwright_browser_path():\n    # System browser is preferred. If absent, Playwright's bundled Chromium is used.\n    return _find_chromium()\n"
          new=("def _playwright_browser_path():\n"
               "    system_path = _find_chromium()\n"
               "    if system_path:\n"
               "        return system_path\n"
               "    try:\n"
               "        from playwright.sync_api import sync_playwright\n"
               "        pw = sync_playwright().start()\n"
               "        try:\n"
               "            bundled = pw.chromium.executable_path\n"
               "        finally:\n"
               "            pw.stop()\n"
               "        if bundled and Path(bundled).exists():\n"
               "            return str(Path(bundled))\n"
               "    except Exception:\n"
               "        pass\n"
               "    return None\n")
          if old not in s: raise SystemExit('No se encontró _playwright_browser_path.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('./V123/index.html'); s=p.read_text(encoding='utf-8')
          matrix='<script src="consumption_matrix.js"></script>'
          integration='<script src="consumption_project_integration.js"></script>'
          bootstrap='<script src="consumption_matrix_bootstrap.js"></script>'
          solarvfd='<script src="solar_vfd.js"></script>'
          s=s.replace('<script src="consumption_schedule.js"></script>','')
          if matrix not in s:
              s=s.replace('</body>',matrix+'\n</body>',1) if '</body>' in s else s+'\n'+matrix+'\n'
          if integration not in s:
              s=s.replace('</body>',integration+'\n</body>',1) if '</body>' in s else s+'\n'+integration+'\n'
          if bootstrap not in s:
              s=s.replace('</body>',bootstrap+'\n</body>',1) if '</body>' in s else s+'\n'+bootstrap+'\n'
          if solarvfd not in s:
              s=s.replace('</body>',solarvfd+'\n</body>',1) if '</body>' in s else s+'\n'+solarvfd+'\n'
          old='<section class="card"><h2>7. Inversor</h2><label class="label">Inversor técnico <span class="pill" id="phaseFilterBadge">TRIFÁSICO</span></label><select id="inverter"><option value="">Automático</option></select><div id="inverterTechCard" class="equipment-spec-grid"></div>'
          new='<section class="card"><h2>7. Inversor</h2><div id="equipmentModeBlock" class="vfd-mode-block"><label class="label" style="margin-top:0">Tipo de equipo de conversión</label><select id="equipmentMode"><option value="inverter">INVERSOR FOTOVOLTAICO — BASE EXISTENTE</option><option value="solar_vfd">VARIADOR DE FRECUENCIA SOLAR — BASE DE BOMBEO</option></select><p class="muted" style="margin-top:8px">Seleccione si el sistema utilizará el inversor fotovoltaico convencional o un variador solar con MPPT. En modo variador, la selección se dimensiona con la potencia máxima simultánea de la Matriz de Consumo.</p></div><label class="label" id="inverterTechnicalLabel">Inversor técnico <span class="pill" id="phaseFilterBadge">TRIFÁSICO</span></label><select id="inverter"><option value="">Automático</option></select><div id="inverterTechCard" class="equipment-spec-grid"></div>'
          if old not in s: raise SystemExit('No se encontró la sección 7 para insertar el selector de equipo.')
          s=s.replace(old,new,1)
          oldq='grid_available_kw:gridAvailable,grid_dc_ac_ratio:gridDcAcRatio'
          newq="grid_available_kw:gridAvailable,grid_dc_ac_ratio:gridDcAcRatio,equipment_mode:$('equipmentMode')?.value||'inverter',solar_vfd_index:$('solarVfd')?.dataset.globalIndex||'',solar_vfd_required_kw:$('solarVfdRequiredInput')?.value||''"
          if oldq not in s: raise SystemExit('No se encontró el objeto de parámetros de /api/design.')
          s=s.replace(oldq,newq,1)
          oldb="if(d.inverter){const inv=d.inverter,ic=findCostForInverter(inv);rows.push(makeOrUpdate('Inversores',()=>({code:ic?.code||'',category:'Inversores',description:'Inversores',detail:`${inv.manufacturer} ${inv.model} — ${inv.ac_kw} kW c/u · ${Number(inv.quantity||1)} unidad(es) · ${d.inputs?.system_phase==='MONOFASICO'?'MONOFÁSICO':d.inputs?.system_phase==='BIFASICO'?'BIFÁSICO':'TRIFÁSICO'}`,unit:'und',qty:Number(inv.quantity||1),cost_price:ic?.price_cop||0,markup_pct:0,tax_pct:0,state:'Incluido',source:ic?`${ic.supplier} · precio público web`:'Precio de costo pendiente de cotización'})));}"
          if oldb not in s: raise SystemExit('No se encontró la partida automática de inversores.')
          newb=oldb+" if(d.solar_vfd?.is_solar_vfd){const v=d.solar_vfd;rows.push(makeOrUpdate('Variadores de frecuencia solar',()=>({code:'BASE-VFD-'+String(v.model).replace(/\\W+/g,'-').toUpperCase(),category:'Variadores de frecuencia solar',description:'Variador de frecuencia solar',detail:`${v.manufacturer} ${v.model} — ${v.power_kw} kW · motor ${v.motor_recommended_hp} · ${v.output_voltage}`,unit:'und',qty:Number(v.quantity||1),cost_price:Number(v.price_cop||0),markup_pct:0,tax_pct:0,state:'Incluido',source:'Base de datos de variadores de frecuencia solar suministrada por el usuario'})));}"
          s=s.replace(oldb,newb,1)
          s=s.replace("'Módulos FV','Inversores','Medidores bidireccionales','Baterías'", "'Módulos FV','Inversores','Variadores de frecuencia solar','Medidores bidireccionales','Baterías'",1)
          oldsrc="$('budgetSource').innerHTML=`Sistema: <b>${fmt(d.system.dc_kwp,2)} kWp DC</b> · ${fmt(d.system.modules,0)} módulos · inversor: ${d.inverter?d.inverter.manufacturer+' '+d.inverter.model:'pendiente'}. El presupuesto se actualiza sin reiniciar las partidas existentes.`;"
          newsrc="$('budgetSource').innerHTML=`Sistema: <b>${fmt(d.system.dc_kwp,2)} kWp DC</b> · ${fmt(d.system.modules,0)} módulos · equipo de conversión: ${d.solar_vfd?.is_solar_vfd?d.solar_vfd.manufacturer+' '+d.solar_vfd.model:(d.inverter?d.inverter.manufacturer+' '+d.inverter.model:'pendiente')}. El presupuesto se actualiza sin reiniciar las partidas existentes.`;"
          if oldsrc not in s: raise SystemExit('No se encontró el texto de origen del presupuesto.')
          s=s.replace(oldsrc,newsrc,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('./V123/server.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("INVERTERS = DATA / 'inverters.json'\nBATTERIES = DATA / 'batteries.json'", "INVERTERS = DATA / 'inverters.json'\nSOLAR_VFDS = DATA / 'solar_vfd.json'\nBATTERIES = DATA / 'batteries.json'",1)
          s=s.replace("def batteries():\n    return load(BATTERIES, [])", "def batteries():\n    return load(BATTERIES, [])\n\ndef solar_vfds():\n    return load(SOLAR_VFDS, [])",1)
          needle="    phase=str(payload.get('system_phase') or 'TRIFASICO').upper()\n    if phase not in ('MONOFASICO','BIFASICO','TRIFASICO'): raise ValueError('Tipo de sistema no válido. Seleccione MONOFÁSICO, BIFÁSICO o TRIFÁSICO.')"
          repl="    phase=str(payload.get('system_phase') or 'TRIFASICO').upper()\n    equipment_mode=str(payload.get('equipment_mode') or 'inverter').lower().strip()\n    if equipment_mode not in ('inverter','solar_vfd'): equipment_mode='inverter'\n    if phase not in ('MONOFASICO','BIFASICO','TRIFASICO'): raise ValueError('Tipo de sistema no válido. Seleccione MONOFÁSICO, BIFÁSICO o TRIFÁSICO.')"
          if needle not in s: raise SystemExit('No se encontró la definición de fase en server.py.')
          s=s.replace(needle,repl,1)
          needle="    phase_note=None\n    if not phase_candidates:"
          repl="""    solar_vfd_result=None
    if equipment_mode=='solar_vfd':
        vfds=solar_vfds()
        candidates_vfd=[(i,v) for i,v in enumerate(vfds) if str(v.get('phase_class','')).upper()==phase]
        if not candidates_vfd:
            raise ValueError(f'La base de variadores no contiene equipos para la fase {phase}.')
        vi_raw=payload.get('solar_vfd_index')
        if vi_raw in (None,''):
            required_kw=float(payload.get('solar_vfd_required_kw') or 0)
            viable=[(float(v.get('power_kw') or 0),i,v) for i,v in candidates_vfd if float(v.get('power_kw') or 0)>=required_kw-1e-9]
            viable.sort(key=lambda x:(x[0],x[2].get('price_cop') or 0,x[1]))
            vi=viable[0][1] if viable else min(candidates_vfd,key=lambda x:float(x[1].get('power_kw') or 0))[0]
        else:
            vi=int(vi_raw)
            if vi<0 or vi>=len(vfds): raise ValueError('Variador de frecuencia solar no válido.')
            if str(vfds[vi].get('phase_class','')).upper()!=phase: raise ValueError('El variador seleccionado no corresponde a la fase del sistema.')
        v=vfds[vi]
        power_kw=float(v.get('power_kw') or 0)
        required_kw=float(payload.get('solar_vfd_required_kw') or 0)
        if power_kw<=0: raise ValueError('El variador seleccionado no tiene potencia válida.')
        if required_kw>power_kw+1e-9: raise ValueError(f'La potencia de diseño del variador ({required_kw:.2f} kW) supera la potencia disponible de {power_kw:.2f} kW en la base. Seleccione una referencia superior o revise la carga.')
        solar_vfd_result={'index':vi,**v,'quantity':1,'required_power_kw':required_kw,'selection_basis':'Potencia máxima simultánea de la Matriz de Consumo + 10 % de margen','is_solar_vfd':True}
        selected_inv=None
    phase_note=None
    if not phase_candidates:"""
          if needle not in s: raise SystemExit('No se encontró el punto de inserción del variador en server.py.')
          s=s.replace(needle,repl,1)
          needle="    # OFF-GRID: size the battery bank automatically from daily energy demand and the selected battery database record."
          repl="""    if equipment_mode=='solar_vfd' and solar_vfd_result:
        electrical={'status':'SOLAR_VFD','message':'El variador solar incorpora MPPT y reemplaza el inversor fotovoltaico convencional. La tensión, corriente, motor y configuración de bombeo deben verificarse con la ficha técnica del equipo y del motor.','power_kw':solar_vfd_result['power_kw'],'required_power_kw':solar_vfd_result['required_power_kw']}

    # OFF-GRID: size the battery bank automatically from daily energy demand and the selected battery database record."""
          if needle not in s: raise SystemExit('No se encontró el bloque OFF-GRID en server.py.')
          s=s.replace(needle,repl,1)
          s=s.replace("ac_required=float(selected_inv.get('ac_kw_total') or 0) if selected_inv else 0", "ac_required=float(selected_inv.get('ac_kw_total') or 0) if selected_inv else float(solar_vfd_result.get('power_kw') or 0) if solar_vfd_result else 0",1)
          s=s.replace("'system_type':system_type,'battery_storage_hours':storage_hours if system_type=='OFF-GRID' else None}", "'system_type':system_type,'battery_storage_hours':storage_hours if system_type=='OFF-GRID' else None,'equipment_mode':equipment_mode}",1)
          s=s.replace("'inverter':selected_inv,'electrical':electrical,'phase_note':phase_note,'battery':battery_result,", "'inverter':selected_inv,'solar_vfd':solar_vfd_result,'electrical':electrical,'phase_note':phase_note,'battery':battery_result,",1)
          p.write_text(s,encoding='utf-8')
          PY
          touch ./V123/data/projects.json ./V123/data/projects.backup.json
          python -m py_compile ./V123/server.py
          test -f ./V123/index.html
          test -f ./V123/server.py
          test -f ./V123/consumption_matrix.js
          test -f ./V123/consumption_project_integration.js
          test -f ./V123/consumption_matrix_bootstrap.js
          test -f ./V123/solar_vfd.js
          test -f ./V123/data/modules.json
          test -f ./V123/data/inverters.json
          test -f ./V123/data/solar_vfd.json
          grep -q "pw.chromium.executable_path" ./V123/server.py
          grep -q "consumption_matrix.js" ./V123/index.html
          grep -q "consumption_project_integration.js" ./V123/index.html
          grep -q "consumption_matrix_bootstrap.js" ./V123/index.html
          grep -q "solar_vfd.js" ./V123/index.html
          grep -q "equipmentMode" ./V123/index.html
          grep -q "solar_vfd_required_kw" ./V123/index.html
          grep -q "solar_vfd" ./V123/server.py
          ! grep -q "consumption_schedule.js" ./V123/index.html

      - name: Commit V153.26
        run: |
          set -euxo pipefail
          git config user.name 'E-SUN POWER Bot'
          git config user.email 'e-sunpower-bot@users.noreply.github.com'
          git add V123
          git commit -m 'feat: add solar VFD option and consumption sizing' || echo 'No changes to commit'
          git push origin HEAD:main
