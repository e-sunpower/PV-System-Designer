name: Deploy E-SUN POWER V153.26 bundle

on:
  push:
    paths:
      - 'ONLINE_DEPLOY_V15326'
      - '.github/workflows/deploy-v15326.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download V153.26 bundle
        env:
          SHARE_ID: f7R5anRL5hl-
          FILE_ID: 01a08d24fb42770ea79239c34a5a0c8f
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os, requests
          base='https://api.firestorage.ai/dev/file'
          sid=os.environ['SHARE_ID']
          fid=os.environ['FILE_ID']
          s=requests.Session()
          r=s.post(f'{base}/shares/{sid}/cushion-sessions',headers={'Content-Type':'application/json'},json={},timeout=60)
          r.raise_for_status()
          cushion=r.json()['cushionId']
          r=s.post(f'{base}/shares/{sid}/files/{fid}/download',headers={'X-Firestorage-Cushion-Id':cushion},timeout=60)
          r.raise_for_status()
          info=r.json()
          d=s.get(info['downloadUrl'],stream=True,timeout=180)
          d.raise_for_status()
          with open('/tmp/v15326.zip','wb') as out:
              for chunk in d.iter_content(1024*1024):
                  if chunk: out.write(chunk)
          print('zip_bytes=',os.path.getsize('/tmp/v15326.zip'))
          PY

      - name: Install V153.26 into V123
        run: |
          set -euxo pipefail
          rm -rf /tmp/v15326 ./V123
          mkdir -p /tmp/v15326 ./V123
          unzip -q /tmp/v15326.zip -d /tmp/v15326
          ROOT=$(find /tmp/v15326 -mindepth 1 -maxdepth 1 -type d | head -n1)
          cp -a "$ROOT"/. ./V123/
          rm -rf ./V123/__pycache__
          python - <<'PY'
          from pathlib import Path
          p=Path('./V123/server.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("HOST = os.environ.get('HOST', '127.0.0.1')", "HOST = os.environ.get('HOST', '0.0.0.0')")
          old="def _playwright_browser_path():\n    # System browser is preferred. If absent, Playwright's bundled Chromium is used.\n    return _find_chromium()\n"
          new=("def _playwright_browser_path():\n"
               "    # Prefer an explicitly configured/system browser. If none exists on Render,\n"
               "    # resolve Playwright's own bundled Chromium executable.\n"
               "    system_path = _find_chromium()\n"
               "    if system_path:\n"
               "        return system_path\n"
               "    try:\n"
               "        from playwright.sync_api import sync_playwright\n"
               "        pw = sync_playwright().start()\n"
               "        try:\n"
               "            bundled = pw.chromium.executable_path\n"
               "        finally:\n"
               "            pw.stop()\n"
               "        if bundled and Path(bundled).exists():\n"
               "            return str(Path(bundled))\n"
               "    except Exception:\n"
               "        pass\n"
               "    return None\n")
          if old not in s:
              raise SystemExit('No se encontró la función original _playwright_browser_path.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          touch ./V123/data/projects.json ./V123/data/projects.backup.json
          python -m py_compile ./V123/server.py
          test -f ./V123/index.html
          test -f ./V123/server.py
          test -f ./V123/data/modules.json
          test -f ./V123/data/inverters.json
          grep -q "pw.chromium.executable_path" ./V123/server.py
          echo "Imported files: $(find ./V123 -type f | wc -l)"

      - name: Commit V153.26
        run: |
          set -euxo pipefail
          git config user.name 'E-SUN POWER Bot'
          git config user.email 'e-sunpower-bot@users.noreply.github.com'
          git add V123
          git commit -m 'feat: deploy V153.26 with Render Playwright fix' || echo 'No changes to commit'
          git push origin HEAD:main
