name: Import V123 bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v123.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and download V123 bundle
        env:
          SHARE_URL: https://firestorage.ai/ja/f/4tGm-kGGU4oq
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os,re,html,requests
          from urllib.parse import urljoin
          share=os.environ['SHARE_URL']
          s=requests.Session()
          r=s.get(share,allow_redirects=True,timeout=60)
          print('status=',r.status_code,'type=',r.headers.get('content-type'),'url=',r.url)
          text=r.text
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
          print('scripts=',scripts)
          candidates=[]
          for src in scripts:
              u=urljoin(r.url,html.unescape(src))
              try:
                  j=s.get(u,timeout=60).text
              except Exception as e:
                  print('script_error',u,e); continue
              for pat in [r'/api/[^"\']+',r'https?://[^"\']+',r'[^"\']*(?:download|share|file)[^"\']*']:
                  vals=re.findall(pat,j,re.I)
                  if vals:
                      print('SCRIPT',u,'PATTERN',pat)
                      for v in list(dict.fromkeys(vals))[:100]: print(v[:500])
              for m in re.finditer(r'(?:fetch|axios|request)\([^)]{0,500}',j,re.I):
                  print('REQUEST_SNIPPET',m.group(0)[:1000])
          print('Searching page for RSC/API hints')
          for pat in [r'/api/[^"\']+',r'https?://[^"\']+',r'__next_f[^<]+']:
              vals=re.findall(pat,text,re.I)
              for v in list(dict.fromkeys(vals))[:100]: print('PAGE',v[:1000])
          PY
          exit 1

      - name: Extract V123
        run: |
          set -euxo pipefail
          rm -rf /tmp/v123
          mkdir -p /tmp/v123
          unzip -q /tmp/v123.zip -d /tmp/v123
          ROOT=$(find /tmp/v123 -mindepth 1 -maxdepth 1 -type d | head -n1)
          rm -rf ./V123
          mkdir -p ./V123
          cp -a "$ROOT"/. ./V123/
          rm -rf ./V123/__pycache__
          echo "Imported files: $(find ./V123 -type f | wc -l)"

      - name: Commit V123 files
        run: |
          set -euxo pipefail
          git config user.name 'E-SUN POWER Bot'
          git config user.email 'e-sunpower-bot@users.noreply.github.com'
          git add V123
          git commit -m 'feat: import complete PV System Designer V123' || echo 'No changes to commit'
          git push origin HEAD:main
