name: Inspect firestorage share endpoint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v123.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect share endpoint resolver
        run: |
          python - <<'PY'
          import requests
          j=requests.get('https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js',timeout=60).text
          for needle in ['shareEndpoint','shareId:l','function v(','async function v','function v=','shareEndpoint:o']:
              print('\n###',needle)
              start=0;n=0
              while True:
                  i=j.find(needle,start)
                  if i<0: break
                  print(j[max(0,i-2500):i+3500])
                  start=i+len(needle);n+=1
                  if n>=4:break
          PY
          exit 1
