name: Import V123 bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v123.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and download V123 bundle
        env:
          SHARE_URL: https://firestorage.ai/ja/f/4tGm-kGGU4oq
          SHARE_ID: 4tGm-kGGU4oq
          PUBLIC_ID: F6h2yKO8LqASGvWZ
          SUBDIR: FGjvSi
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os,requests,re,html
          from urllib.parse import urljoin
          share=os.environ['SHARE_URL']; s=requests.Session()
          page=s.get(share,timeout=60).text
          base='https://api.firestorage.ai/dev/file'
          ids=[os.environ['SHARE_ID'],os.environ['PUBLIC_ID']]
          variants=[
            f'{base}/shares/{os.environ["SHARE_ID"]}/files?maxResults=1000',
            f'{base}/shares/{os.environ["SHARE_ID"]}/{os.environ["SUBDIR"]}/files?maxResults=1000',
            f'{base}/shares/{os.environ["PUBLIC_ID"]}/files?maxResults=1000',
            f'{base}/objects/{os.environ["PUBLIC_ID"]}/{os.environ["SUBDIR"]}/files?maxResults=1000',
          ]
          chosen=None; data=None
          for u in variants:
              try:
                  r=s.get(u,timeout=60)
                  print('VARIANT',u,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'))
                  print(r.text[:3000])
                  if r.ok and r.text.lstrip().startswith('{'):
                      chosen=u; data=r.json(); break
              except Exception as e: print('ERR',u,e)
          if not chosen: raise SystemExit('No working firestorage files endpoint')
          print('CHOSEN',chosen)
          print('JSON_KEYS',list(data.keys()))
          open('/tmp/files.json','w').write(r.text)
          files=data.get('files') or data.get('objects') or []
          print('FILES_COUNT',len(files))
          for x in files: print('FILE',x)
          if not files: raise SystemExit('Share contains no files')
          f=files[0]
          fileid=f.get('fileId') or f.get('id') or f.get('file_id')
          if not fileid: raise SystemExit('No file id in response')
          shareid=os.environ['SHARE_ID']
          dl_variants=[
            f'{base}/shares/{shareid}/files/{fileid}/download',
            f'{base}/shares/{shareid}/{os.environ["SUBDIR"]}/files/{fileid}/download',
            f'{base}/shares/{os.environ["PUBLIC_ID"]}/files/{fileid}/download',
          ]
          for u in dl_variants:
              rr=s.get(u,allow_redirects=True,timeout=120)
              print('DOWNLOAD',u,'STATUS',rr.status_code,'TYPE',rr.headers.get('content-type'),'LEN',len(rr.content),'FINAL',rr.url)
              if rr.ok and (rr.content[:2]==b'PK' or 'zip' in rr.headers.get('content-type','').lower()):
                  open('/tmp/v123.zip','wb').write(rr.content); break
          else: raise SystemExit('No working firestorage download endpoint')
          print('ZIP_BYTES',os.path.getsize('/tmp/v123.zip'))
          PY

      - name: Extract V123
        run: |
          set -euxo pipefail
          rm -rf /tmp/v123
          mkdir -p /tmp/v123
          unzip -q /tmp/v123.zip -d /tmp/v123
          ROOT=$(find /tmp/v123 -mindepth 1 -maxdepth 1 -type d | head -n1)
          rm -rf ./V123
          mkdir -p ./V123
          cp -a "$ROOT"/. ./V123/
          rm -rf ./V123/__pycache__
          echo "Imported files: $(find ./V123 -type f | wc -l)"

      - name: Commit V123 files
        run: |
          set -euxo pipefail
          git config user.name 'E-SUN POWER Bot'
          git config user.email 'e-sunpower-bot@users.noreply.github.com'
          git add V123
          git commit -m 'feat: import complete PV System Designer V123' || echo 'No changes to commit'
          git push origin HEAD:main
