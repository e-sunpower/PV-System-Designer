name: Inspect firestorage download route

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-v123.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect route construction
        run: |
          python - <<'PY'
          import requests,re
          u='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          j=requests.get(u,timeout=60).text
          for needle in ['files/${e.fileId}/download','let B=','B=','const B','function']:
              print('\n###',needle)
              start=0; n=0
              while True:
                  i=j.find(needle,start)
                  if i<0: break
                  print(j[max(0,i-1800):i+2200])
                  start=i+len(needle); n+=1
                  if n>=5: break
          print('\n### API-like strings')
          for x in sorted(set(re.findall(r'["\'`]([^"\'`]{0,180}(?:shares|download|visitor|file)[^"\'`]{0,180})["\'`]',j,re.I))):
              print(x)
          PY
          exit 1
